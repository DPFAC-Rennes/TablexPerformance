<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="p-3 h-screen flex flex-col">

    <!-- BARRE DE RECHERCHE HARMONISÉE -->
    <div class="mb-3 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Rechercher un GM, libellé, segment..." 
            class="w-full bg-slate-900 border border-slate-700/80 text-slate-200 text-sm rounded-xl pl-10 pr-3 py-2.5 focus:outline-none focus:border-indigo-500 shadow-inner transition">
    </div>

    <!-- LISTE DES CARTES -->
    <div id="gmList" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
        <div class="text-center text-slate-400 py-10 text-sm">Chargement des données...</div>
    </div>

    <script>
        let allRecords = [];
        let selectedRecordId = null;

        grist.ready({ requiredAccess: 'read' });

        grist.onRecord(function(record) {
            if (record && record.id) {
                selectedRecordId = record.id;
                renderList();
            }
        });

        grist.onRecords(function(records, mappings) {
            allRecords = records.map(r => {
                const mapped = grist.mapColumnNames(r) || r;
                return { id: r.id, ...mapped };
            });
            renderList();
        });

        document.getElementById('searchInput').addEventListener('input', renderList);

        function renderList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('gmList');
            
            const filtered = allRecords.filter(item => {
                const gm = String(item.GM || '').toLowerCase();
                const libelle = String(item.Libelle_du_GM || '').toLowerCase();
                const segment = String(item.Segment || '').toLowerCase();
                return gm.includes(query) || libelle.includes(query) || segment.includes(query);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm">Aucun résultat trouvé.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isSelected = item.id === selectedRecordId;
                
                // Style identique aux blocs de droite selon l'état sélectionné
                const activeClass = isSelected 
                    ? 'bg-slate-900 border-emerald-500 shadow-lg ring-1 ring-emerald-500/50' 
                    : 'bg-slate-900/80 border-slate-700/70 hover:bg-slate-900 hover:border-slate-600';

                return `
                    <div onclick="selectGM(${item.id})" 
                        class="p-3.5 rounded-xl border transition cursor-pointer ${activeClass}">
                        <div class="flex items-center justify-between mb-2">
                            <div class="bg-indigo-600/30 border border-indigo-500/50 text-indigo-300 px-2.5 py-1 rounded-lg font-mono font-bold text-xs shadow-inner">
                                <i class="fa-solid fa-barcode mr-1.5 text-indigo-400"></i>${item.GM || 'N/A'}
                            </div>
                            <span class="text-[11px] text-emerald-400 font-semibold truncate max-w-[140px] px-2 py-0.5 bg-emerald-950/30 border border-emerald-900/40 rounded-md">
                                ${item.Segment || 'Général'}
                            </span>
                        </div>
                        <div class="text-sm font-bold text-white tracking-tight line-clamp-2">
                            ${item.Libelle_du_GM || 'Sans libellé'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectGM(id) {
            selectedRecordId = id;
            renderList();
            grist.setSelectedRecordId(id);
        }
    </script>
</body>
</html>
